apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrawaste-collector
  namespace: infrawaste
  labels:
    app.kubernetes.io/name: infrawaste-collector
    app.kubernetes.io/part-of: infrawaste
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: infrawaste-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrawaste-collector
    spec:
      containers:
        - name: collector
          image: ghcr.io/infrawaste/collector:v0.1.0
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: CLICKHOUSE_HOST
              value: "infrawaste-clickhouse"
            - name: CLICKHOUSE_PORT
              value: "8123"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: infrawaste-collector
  namespace: infrawaste
spec:
  selector:
    app.kubernetes.io/name: infrawaste-collector
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infrawaste-collector-hpa
  namespace: infrawaste
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infrawaste-collector
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
