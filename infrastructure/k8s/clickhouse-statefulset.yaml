apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: infrawaste-clickhouse
  namespace: infrawaste
spec:
  serviceName: infrawaste-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrawaste-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrawaste-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              value: "infrawaste"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          volumeMounts:
            - name: clickhouse-storage
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: infrawaste-clickhouse
  namespace: infrawaste
spec:
  selector:
    app.kubernetes.io/name: infrawaste-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
