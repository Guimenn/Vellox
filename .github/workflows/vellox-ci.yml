name: Vellox CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, package and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Verify workspace versions
        run: pnpm versions:check

      - name: Build monorepo
        run: pnpm build

      - name: Run unit, integration and chaos tests
        run: pnpm test:unit

      - name: Run Python agent tests
        run: pnpm test:python

      - name: Test the packed npm artifact
        run: pnpm test:package

      - name: Smoke-test GitHub Pages root
        run: pnpm test:site

      - name: Run Vellox against itself
        run: node packages/cli/dist/bin.js check --max-critical 0 --max-high 0
