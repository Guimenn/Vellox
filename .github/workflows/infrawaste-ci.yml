name: InfraWaste Performance & Waste CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  waste-gatekeeper:
    name: InfraWaste CI Budget & DDL Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Monorepo
        run: pnpm build

      - name: Run Test Suites & Chaos Resilience
        run: pnpm test

      - name: Evaluate Performance & Waste Budget Gatekeeper
        run: node packages/cli/dist/bin.js check
